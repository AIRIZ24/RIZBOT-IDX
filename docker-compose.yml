version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rizbot-postgres
    environment:
      POSTGRES_DB: rizbot_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rizbot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rizbot-backend
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rizbot_trading
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: your_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - rizbot-network
    command: sh -c "sleep 10 && npm run init-db && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rizbot-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_WS_URL: ws://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rizbot-network

volumes:
  postgres_data:

networks:
  rizbot-network:
    driver: bridge
